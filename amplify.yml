version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm -v
        - npm install
        - npx prisma generate
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=8192"
        - |
          printenv | grep -E '^(DATABASE_URL|DIRECT_URL|JWT_SECRET|ADMIN_EMAIL|ADMIN_PASSWORD|NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME|CLOUDINARY_API_KEY|CLOUDINARY_API_SECRET|RESEND_API_KEY|NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_APP_ENV)=' > .env.production
        - npm run build
        - cp .env.production .next/standalone/.env.production 2>/dev/null || true
        - cp .env.production .next/standalone/.env 2>/dev/null || true
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
      - '.next/cache/**/*'
